name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Test
        run: swift test

      - name: Build universal app
        run: scripts/build.sh

      - name: Render check
        run: |
          'build/direct/Mac Duo Effect.app/Contents/MacOS/MacDuoEffect' --render-check build/render-check

      - name: Read version
        id: version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: scripts/make-dmg.sh "Mac-Duo-Effect-${{ steps.version.outputs.version }}-build.${{ github.run_number }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: Mac Duo Effect ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
        run: |
          {
            echo "Automated build from the latest commit on \`main\`."
            echo
            echo "**Install:** open the DMG and drag **Mac Duo Effect** into Applications."
            echo
            echo "This build is signed ad hoc, not with a Developer ID and not notarized."
            echo "macOS shows a Gatekeeper warning on first launch: open the app from Finder"
            echo "with right click, choose Open, then confirm."
            echo
            echo "Commit: ${{ github.sha }}"
          } > build/release-notes.md
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file build/release-notes.md \
            --latest \
            dist/*.dmg dist/*.dmg.sha256
