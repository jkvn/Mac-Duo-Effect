name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: scripts/build.sh

      - name: Render check
        run: |
          'build/direct/Mac Duo Effect.app/Contents/MacOS/MacDuoEffect' --render-check build/render-check

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Duo-Effect
          path: build/direct/Mac Duo Effect.app
          if-no-files-found: error
